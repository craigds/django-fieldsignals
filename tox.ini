[tox]
envlist =
    py{38,310,312}-dj42
    py{310,312,313}-dj52
    py{312,313}-dj60

[gh-actions]
python =
    3.8: py38-dj42
    3.10: py310-dj42, py310-dj52
    3.12: py312-dj42, py312-dj52, py312-dj60
    3.13: py313-dj52, py313-dj60

[testenv]
commands = pytest -v {posargs}
deps =
    pytest
    dj42: Django~=4.2.0
    dj52: Django~=5.2.0
    dj60: Django~=6.0.0
